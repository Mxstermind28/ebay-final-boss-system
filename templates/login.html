<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Final Boss | Sign in</title><style>body{font-family:system-ui,Arial;background:#11101b;color:#fff;min-height:100vh;display:grid;place-items:center;margin:0}main{width:min(380px,85vw);background:#201c32;border:1px solid #57468b;border-radius:18px;padding:32px}h1{font-size:1.55rem}input,button{box-sizing:border-box;width:100%;padding:14px;border-radius:9px;font-size:1rem}input{background:#100f19;border:1px solid #776d94;color:white}button{margin-top:16px;background:#9566ff;color:#fff;border:0;cursor:pointer}.error{color:#ffb0b0}</style></head><body><main><h1>eBay Final Boss</h1><p>Sign in to your private dashboard.</p>{% for category, message in get_flashed_messages(with_categories=true) %}<p class="error">{{ message }}</p>{% endfor %}<form method="post" action="{{ url_for('login') }}"><label for="password">Dashboard password</label><input id="password" type="password" name="password" required autocomplete="current-password"><button type="submit">Sign in</button></form></main></body></html>
